<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 282" width="1200" height="282" role="img" aria-label="The AI Engineer's Playbook — production AI engineering, written as scenarios, with the code actually run">
  <title>The AI Engineer's Playbook</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#111C2E"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>

    <!-- userSpaceOnUse: an objectBoundingBox gradient on a zero-height line
         is degenerate and renders as nothing. -->
    <linearGradient id="wire" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="1130" y2="0">
      <stop offset="0%" stop-color="#2E5680"/>
      <stop offset="50%" stop-color="#4A7FB5"/>
      <stop offset="100%" stop-color="#2E5680"/>
    </linearGradient>

    <radialGradient id="glowBlue">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowIndigo">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="282" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="280" fill="none" stroke="#1E2D45" stroke-width="2"/>

  <!-- faint grid, so the dark panel reads as deliberate rather than flat -->
  <g stroke="#16233A" stroke-width="1" opacity="0.6">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M150 0V282M300 0V282M450 0V282M600 0V282M750 0V282M900 0V282M1050 0V282"/>
  </g>

  <text x="70" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="700" fill="#E6EDF3" letter-spacing="-0.5">The AI Engineer's Playbook</text>

  <text x="72" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="18" fill="#8B9DB5">Production AI engineering — written as scenarios, with the code actually run.</text>

  <g transform="translate(70, 194)">
    <line x1="0" y1="0" x2="1060" y2="0" stroke="url(#wire)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- travelling pulses -->
    <g>
      <circle r="24" fill="url(#glowBlue)">
        <animate attributeName="cx" values="0;1060" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle r="4.5" fill="#38BDF8">
        <animate attributeName="cx" values="0;1060" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle r="24" fill="url(#glowIndigo)">
        <animate attributeName="cx" values="0;1060" dur="6s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <circle r="4.5" fill="#818CF8">
        <animate attributeName="cx" values="0;1060" dur="6s" begin="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle r="24" fill="url(#glowBlue)">
        <animate attributeName="cx" values="0;1060" dur="6s" begin="4s" repeatCount="indefinite"/>
      </circle>
      <circle r="4.5" fill="#38BDF8">
        <animate attributeName="cx" values="0;1060" dur="6s" begin="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- stages -->
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
       font-size="13" fill="#8195AD" text-anchor="middle">

      <g>
        <circle cx="0" cy="0" r="7" fill="#0B1220" stroke="#38BDF8" stroke-width="2.5"/>
        <circle cx="0" cy="0" r="7" fill="none" stroke="#38BDF8" stroke-width="2">
          <animate attributeName="r" values="7;15;7" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.85;0;0.85" dur="6s" repeatCount="indefinite"/>
        </circle>
        <text x="0" y="32">internals</text>
      </g>

      <g>
        <circle cx="212" cy="0" r="7" fill="#0B1220" stroke="#38BDF8" stroke-width="2.5"/>
        <circle cx="212" cy="0" r="7" fill="none" stroke="#38BDF8" stroke-width="2">
          <animate attributeName="r" values="7;15;7" dur="6s" begin="1.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.85;0;0.85" dur="6s" begin="1.2s" repeatCount="indefinite"/>
        </circle>
        <text x="212" y="32">models</text>
      </g>

      <g>
        <circle cx="424" cy="0" r="7" fill="#0B1220" stroke="#818CF8" stroke-width="2.5"/>
        <circle cx="424" cy="0" r="7" fill="none" stroke="#818CF8" stroke-width="2">
          <animate attributeName="r" values="7;15;7" dur="6s" begin="2.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.85;0;0.85" dur="6s" begin="2.4s" repeatCount="indefinite"/>
        </circle>
        <text x="424" y="32">retrieval</text>
      </g>

      <g>
        <circle cx="636" cy="0" r="7" fill="#0B1220" stroke="#818CF8" stroke-width="2.5"/>
        <circle cx="636" cy="0" r="7" fill="none" stroke="#818CF8" stroke-width="2">
          <animate attributeName="r" values="7;15;7" dur="6s" begin="3.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.85;0;0.85" dur="6s" begin="3.6s" repeatCount="indefinite"/>
        </circle>
        <text x="636" y="32">agents</text>
      </g>

      <g>
        <circle cx="848" cy="0" r="7" fill="#0B1220" stroke="#FBBF24" stroke-width="2.5"/>
        <circle cx="848" cy="0" r="7" fill="none" stroke="#FBBF24" stroke-width="2">
          <animate attributeName="r" values="7;15;7" dur="6s" begin="4.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.85;0;0.85" dur="6s" begin="4.8s" repeatCount="indefinite"/>
        </circle>
        <text x="848" y="32">evaluation</text>
      </g>

      <g>
        <circle cx="1060" cy="0" r="7" fill="#0B1220" stroke="#FBBF24" stroke-width="2.5"/>
        <circle cx="1060" cy="0" r="7" fill="none" stroke="#FBBF24" stroke-width="2">
          <animate attributeName="r" values="7;16;7" dur="6s" begin="5.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.9;0;0.9" dur="6s" begin="5.4s" repeatCount="indefinite"/>
        </circle>
        <text x="1060" y="32">production</text>
      </g>
    </g>
  </g>

  <g stroke="#2E5680" stroke-width="2" fill="none">
    <path d="M30 20H20V30"/>
    <path d="M1170 20H1180V30"/>
    <path d="M30 262H20V252"/>
    <path d="M1170 262H1180V252"/>
  </g>
</svg>

name: A scenario doesn't match reality
description: The most useful report this repo can get. Something here wouldn't survive contact with production.
labels: ["accuracy"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks — this is the failure mode the material is most exposed to and the hardest
        to catch alone. Detail beats politeness here.

  - type: input
    id: location
    attributes:
      label: Where
      description: File, and the scenario or section within it.
      placeholder: 12-senior-scenarios/scaling.md — scenario 2, "100× in Eight Months"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What's wrong with it
      description: What would actually happen, and why the scenario as written wouldn't.
    validations:
      required: true

  - type: textarea
    id: experience
    attributes:
      label: What you've seen instead
      description: >
        Numbers, scale, and context if you can share them — traffic, hardware, model,
        team size. Rough figures are fine; "somewhere between X and Y" is still evidence.
    validations:
      required: false

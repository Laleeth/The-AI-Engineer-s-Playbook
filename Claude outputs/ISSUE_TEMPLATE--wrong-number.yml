name: A number looks wrong
description: A figure in the docs doesn't match your experience, or doesn't match its own arithmetic.
labels: ["accuracy", "numbers"]
body:
  - type: input
    id: location
    attributes:
      label: Where
      description: File and, if you have it, the line.
      placeholder: 01-llm-internals/kv-cache.md — the 80GB concurrency example
    validations:
      required: true

  - type: input
    id: claim
    attributes:
      label: The number as written
    validations:
      required: true

  - type: textarea
    id: correction
    attributes:
      label: What it should be, and how you got there
      description: >
        Show the arithmetic or the measurement. If a figure is workload-dependent rather
        than wrong, say so — "measure it" may be the right fix.
    validations:
      required: true

  - type: checkboxes
    id: verified
    attributes:
      label: Checked against the verifier?
      options:
        - label: I ran `python scripts/verify.py` and it passed, so the claims check doesn't cover this number yet
          required: false
